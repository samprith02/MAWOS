services:
  - type: web
    name: mawos
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MAWOS_ENV
        value: production
      - key: MAWOS_JWT_SECRET
        generateValue: true
      - key: MAWOS_DATABASE_URL
        fromDatabase:
          name: mawos-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # set by hand in the dashboard; never in git
databases:
  - name: mawos-db
    plan: free
