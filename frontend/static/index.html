<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITE · MAWOS — University Portal</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-palette="#3b6bb5,#8f6a1a">

<!-- ================= LOGIN ================= -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="crest">
      <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <path d="M32 3 L58 13 v20 c0 15-11 24-26 28 C17 57 6 48 6 33 V13 Z"
              fill="#16283c" stroke="#b08b2e" stroke-width="2.5"/>
        <text x="32" y="41" text-anchor="middle" font-family="Georgia,serif"
              font-size="26" fill="#f3e6c4" font-weight="bold">M</text>
      </svg>
    </div>
    <h1 class="wordmark">Mangalore Institute of<br>Technology &amp; Engineering</h1>
    <p class="tagline">MAWOS · Multi-Agent Workflow Orchestration System</p>
    <div class="rule"></div>
    <input id="login-username" placeholder="Username" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" class="btn primary">Sign in to the portal</button>
    <p id="login-error" class="error"></p>
    <div class="demo-chips">
      <span>Demo:</span>
      <button data-u="4MT23AI049" data-p="student123">Student</button>
      <button data-u="aiml.f02" data-p="faculty123">Faculty</button>
      <button data-u="hod.aiml" data-p="faculty123">HOD</button>
      <button data-u="principal" data-p="principal123">Principal</button>
      <button data-u="admin" data-p="admin123">Admin</button>
    </div>
  </div>
  <p class="login-foot">Est. 2007 · Autonomous Institute affiliated to VTU, Belagavi</p>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="hidden">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
        <path d="M32 3 L58 13 v20 c0 15-11 24-26 28 C17 57 6 48 6 33 V13 Z"
              fill="#16283c" stroke="#b08b2e" stroke-width="2.5"/>
        <text x="32" y="41" text-anchor="middle" font-family="Georgia,serif"
              font-size="26" fill="#f3e6c4" font-weight="bold">M</text>
      </svg>
      <div>
        <div class="brand-name">MITE</div>
        <div class="brand-sub">University Portal</div>
      </div>
    </div>
    <nav id="nav-tabs"></nav>
    <div class="header-right">
      <span id="ai-badge" class="ai-badge" title="Orchestrator language mode"></span>
      <span id="user-name" class="user-chip"></span>
      <button id="logout-btn" class="btn ghost">Sign out</button>
    </div>
  </header>

  <main id="main-content"></main>

  <footer>MAWOS v2 · event-driven multi-agent workflow orchestration ·
    research prototype, Dept. of AI&amp;ML</footer>
</div>

<script src="/static/app.js"></script>
</body>
</html>
